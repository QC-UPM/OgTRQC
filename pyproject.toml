[tool.poetry]
name = "octa-gtrqc-sim"
version = "0.1.0"
description = "Proof of Concept simulation for Octahedral gTRQC hydrogenated nickelate memory"
authors = ["Joaquín Ordieres-Meré <j.ordieres@upm.es>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pyyaml = "^6.0.1"
plotly = "^6.8.0"
numpy = "^2.4.4"
pandas = "^3.0.2"

[tool.poetry.group.dev.dependencies]
sphinx = "^7.2.6"
sphinx-rtd-theme = "^2.0.0"
pytest = "^8.0.0"
sphinxcontrib-mermaid = "^2.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
