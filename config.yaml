# =============================================================================
# Octahedral gTRQC Hydrogenated Nickelate Memory Simulation Configuration
# =============================================================================

# Target directory path where interactive Plotly HTML reports will be stored
output_directory: "./reports_quantum/"

engine: "quantum"

simulation_steps: 6
g_oct_stiffness: 3.5

# Number of discrete time steps (\Delta t) to execute in the coupling loop
simulation_steps: 6

# Graphistic response operator scaling parameter (G_oct stiffness matrix)
g_oct_stiffness: 3.5

# Non-Markovian temporal latency buffer length for protonic/lattice feedback (d_elay)
protonic_delay_steps: 2

# Baseline resolution boundary parameter for localized console logging
epsilon_bound: 0.02

# Goal 4: Parametric resolution sweep for Kolmogorov-Tikhomirov entropy capacity analysis
# The presenter will dynamically evaluate C_atom(\epsilon) = \log(N_\epsilon) for each value.
goal_4_epsilon_sweep:
  - 0.100   # Coarse resolution limit
  - 0.050   # Intermediate threshold
  - 0.020   # Baseline threshold
  - 0.010   # Fine resolution limit
  - 0.005   # Ultra-fine micro-state identification
  - 0.002   # Deep sub-lattice phase resolution

# Initial quantum matter proxy state (Density matrix track matrix bounds: [0.0, 1.0])
initial_rho: 1.0

# Initial physical parameters representing the localized NiO6 octahedral cage structural register
initial_register:
  theta_tilt: 0.12    # Initial octahedral tilting angle component
  theta_rot: 0.06     # Initial octahedral rotation angle component
  delta_V_oct: 0.00   # Initial discrete volume displacement variable
  delta_phi: 0.03     # Deviation parameter of the internal Ni-O-Ni bond angle
  epsilon_0: 1.0      # Baseline ground energy profile parameter

# Externally applied time-dependent driving potential voltage vector profile [V(t)]
# Must match or exceed the length of 'simulation_steps'
voltage_profile:
  - 1.0
  - 1.5
  - 1.2
  - 0.8
  - 0.4
  - 0.0

# Recoverability loss tracker profile over time [\Delta_0(t)] driven by hidden proton polarons
# High values increase the dynamic backreaction force applied to the geometry register
recoverability_loss_profile:
  - 0.1
  - 0.2
  - 0.3
  - 0.2
  - 0.1
  - 0.0
#
