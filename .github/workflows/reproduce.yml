name: Recalculate supplement analyses

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - run: poetry run proton-study --study all --output generated/native
      - run: poetry run python scripts/verify_migration.py --output generated/native/migration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplement-recalculation
          path: |
            generated/
